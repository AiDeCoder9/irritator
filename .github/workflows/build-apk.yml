name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Email is optional. It only runs when all three secrets exist (see README).
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK (arm64 only, signed with the debug key for sideloading)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/irritator-${{ github.run_number }}.apk"
          ls -lh dist

      - name: Upload as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: irritator-apk
          path: dist/irritator-${{ github.run_number }}.apk
          retention-days: 14

      - name: Publish a GitHub release with the APK
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" "dist/irritator-${{ github.run_number }}.apk" \
            --prerelease \
            --title "Build ${{ github.run_number }}" \
            --notes "Commit ${{ github.sha }}. Download the .apk on your phone and install it."
          echo "url=${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_OUTPUT"

      - name: Email the download link
        if: ${{ env.MAIL_USERNAME != '' && env.MAIL_PASSWORD != '' && env.MAIL_TO != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: IRRITATOR builds <${{ secrets.MAIL_USERNAME }}>
          subject: IRRITATOR build ${{ github.run_number }} is ready
          body: |
            Build ${{ github.run_number }} finished.

            Open this link on your phone (signed in to GitHub) and download the .apk:
            ${{ steps.release.outputs.url }}
